# Funding sources for AI Interview Coach.
#
# AI Interview Coach is Apache-2.0 open-source software. Sponsorships can fund
# the voice infrastructure (LiveKit / STT / TTS / LLM) that makes free mock
# interviews possible. Uncomment and fill in a line once the corresponding
# account exists — leaving placeholder usernames active renders broken
# "Sponsor" buttons.
#
# Docs: https://docs.github.com/get-started/quickstart/customizing-your-repository

# github: [YOUR_GITHUB_SPONSORS_USERNAME]
# open_collective: YOUR_OPEN_COLLECTIVE_SLUG
# patreon: YOUR_PATREON_USERNAME
# ko_fi: YOUR_KO_FI_USERNAME
# liberapay: YOUR_LIBERAPAY_USERNAME
# custom: ["https://your-domain.example/sponsor"]
